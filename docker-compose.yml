version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - CORS_ALLOW_ORIGINS=*
      - STORAGE_DIR=/app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000


